name: Fool House regression
on:
  push:
    paths: ['fool-house/**', '.github/workflows/fool-house-regression.yml']
  pull_request:
    paths: ['fool-house/**', '.github/workflows/fool-house-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fool-house
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fool-house/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:regression
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fool-house-regression-results
          retention-days: 14
          if-no-files-found: ignore
          path: |
            fool-house/playwright-report/
            fool-house/test-results/
            fool-house/coverage/e2e/report/
            fool-house/coverage/e2e/summary.json
